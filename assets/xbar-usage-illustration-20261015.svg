<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">Illustrative xbar usage menu</title><desc id="desc">Fictional example showing five-hour usage at 25 percent and seven-day usage at 40 percent. No personal account data.</desc><rect width="720" height="460" fill="#111713"/><rect x="90" y="25" width="540" height="44" rx="8" fill="#28322c"/><g font-family="ui-monospace, SFMono-Regular, monospace" fill="#edf4ee"><text x="117" y="54" font-size="20">Claude usage · 25%</text><rect x="90" y="81" width="540" height="345" rx="12" fill="#202822" stroke="#526356"/><text x="117" y="124" font-size="21">Claude usage</text><text x="117" y="165" font-size="18">5-hour limit</text><text x="574" y="165" font-size="18" text-anchor="end">25%</text><rect x="117" y="182" width="460" height="12" rx="6" fill="#3c4c40"/><rect x="117" y="182" width="115" height="12" rx="6" fill="#9bdfaa"/><text x="117" y="226" font-size="18">7-day limit</text><text x="574" y="226" font-size="18" text-anchor="end">40%</text><rect x="117" y="243" width="460" height="12" rx="6" fill="#3c4c40"/><rect x="117" y="243" width="184" height="12" rx="6" fill="#9bdfaa"/><text x="117" y="296" font-size="17" fill="#b9c6bc">Reset times appear in the menu</text><path d="M117 317h460" stroke="#526356"/><text x="117" y="353" font-size="18">Open Claude usage ↗</text><text x="117" y="396" font-size="15" fill="#9bdfaa">Illustration · fictional example</text></g></svg>
